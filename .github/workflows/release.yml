name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Writtt ${{ github.ref_name }}"
          body: |
            ## Writtt ${{ github.ref_name }}

            Local-First Distraction-Free Editorial Studio & Zero-Knowledge Cryptographic Vault.

            ### Downloads

            | Platform | Artifact | Format |
            | :--- | :--- | :--- |
            | **Windows (x64)** | `writtt-windows-amd64.exe` | Standalone Native Executable |
            | **macOS (Universal)** | `writtt-macos-universal.zip` | Native macOS Bundle |
            | **Linux (x64)** | `writtt-linux-amd64.tar.gz` | Compressed Native Binary |

            ### Notes
            - **Official Documentation & Release Guide:** https://www.writtt.com
            - **Windows:** Native WebView2 executable — if SmartScreen appears on first launch, choose _More info -> Run anyway_.
            - **macOS:** On first launch of an unsigned build, open via _System Settings -> Privacy & Security -> Open Anyway_.
            - **Linux:** Extract and run `chmod +x writtt && ./writtt`.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  build-windows:
    name: Build Windows (x64)
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install & Test Frontend
        working-directory: frontend
        run: |
          npm install
          npx vitest run
          npm run build

      - name: Run Backend Tests
        run: go test -count=1 ./...

      - name: Build Windows Native Executable (Wails v3)
        shell: pwsh
        run: |
          go build -tags production -ldflags "-s -w -H windowsgui -X main.CurrentVersion=${{ github.ref_name }}" -o writtt-windows-amd64.exe .

      - name: Upload Windows Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: writtt-windows-amd64.exe

  build-macos:
    name: Build macOS
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install & Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Build macOS Binary (Wails v3)
        run: |
          CGO_ENABLED=1 go build -tags production -ldflags "-s -w -X main.CurrentVersion=${{ github.ref_name }}" -o writtt .
          zip -r writtt-macos-universal.zip writtt

      - name: Upload macOS Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: writtt-macos-universal.zip

  build-linux:
    name: Build Linux (x64)
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install GTK3 & WebKit2GTK System Libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Install & Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Build Linux Binary (Wails v3)
        run: |
          CGO_ENABLED=1 go build -tags production -ldflags "-s -w -X main.CurrentVersion=${{ github.ref_name }}" -o writtt .
          tar -czf writtt-linux-amd64.tar.gz writtt

      - name: Upload Linux Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: writtt-linux-amd64.tar.gz
