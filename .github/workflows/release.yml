name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (Installer + Portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install, Test & Build Frontend
        working-directory: frontend
        run: |
          npm install
          npx vitest run
          npm run build

      - name: Run Backend Tests
        run: go test -count=1 ./...

      - name: Build Windows Portable & NSIS Installer (Wails v3)
        shell: pwsh
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = $env:RAW_TAG.TrimStart('v')

          go build -tags production -ldflags "-s -w -H windowsgui -X main.CurrentVersion=$ver" -o writtt-windows-amd64.exe .

          # Generate multi-resolution icon.ico from build/appicon.png
          New-Item -ItemType Directory -Force -Path "build\windows" | Out-Null
          Add-Type -AssemblyName System.Drawing
          $sizes  = @(256, 128, 64, 48, 32, 16)
          $src    = [System.Drawing.Image]::FromFile((Resolve-Path "build\appicon.png").Path)
          $images = @()
          foreach ($sz in $sizes) {
            $bmp = New-Object System.Drawing.Bitmap($sz, $sz)
            $g   = [System.Drawing.Graphics]::FromImage($bmp)
            $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $g.DrawImage($src, 0, 0, $sz, $sz)
            $g.Dispose()
            $ms = New-Object System.IO.MemoryStream
            $bmp.Save($ms, [System.Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
            $images += @{ Size = $sz; Bytes = $ms.ToArray() }
            $ms.Dispose()
          }
          $src.Dispose()
          $out = New-Object System.IO.MemoryStream
          $bw  = New-Object System.IO.BinaryWriter($out)
          $bw.Write([uint16]0); $bw.Write([uint16]1); $bw.Write([uint16]$images.Count)
          $offset = 6 + ($images.Count * 16)
          foreach ($img in $images) {
            $dim = [byte]0
            if ($img.Size -ne 256) { $dim = [byte]$img.Size }
            $bw.Write($dim); $bw.Write($dim); $bw.Write([byte]0); $bw.Write([byte]0)
            $bw.Write([uint16]1); $bw.Write([uint16]32)
            $bw.Write([uint32]$img.Bytes.Length); $bw.Write([uint32]$offset)
            $offset += $img.Bytes.Length
          }
          foreach ($img in $images) { $bw.Write($img.Bytes) }
          $bw.Flush()
          [System.IO.File]::WriteAllBytes((Join-Path (Resolve-Path "build\windows").Path "icon.ico"), $out.ToArray())
          $bw.Dispose(); $out.Dispose()

          # Locate NSIS compiler (pre-installed on windows-latest; fallback to Chocolatey)
          $makensis = @(
            "C:\Program Files (x86)\NSIS\makensis.exe",
            "C:\Program Files\NSIS\makensis.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) {
            choco install nsis --yes --no-progress
            $makensis = @(
              "C:\Program Files (x86)\NSIS\makensis.exe",
              "C:\Program Files\NSIS\makensis.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $makensis) { throw "makensis.exe not found" }

          & $makensis "/DPRODUCT_VERSION=$ver" "build\windows\installer.nsi"
          if ($LASTEXITCODE -ne 0) { throw "NSIS build failed with exit code $LASTEXITCODE" }
          Get-Item writtt-windows-amd64.exe, writtt-windows-amd64-installer.exe | Select-Object Name, Length | Format-Table

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asset-windows
          path: |
            writtt-windows-amd64-installer.exe
            writtt-windows-amd64.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS (DMG + Universal ZIP)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install & Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Build macOS Universal App Bundle & DMG (Wails v3)
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VER="${RAW_TAG#v}"
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -tags production -ldflags "-s -w -X main.CurrentVersion=${VER}" -o writtt-arm64 .
          if CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -tags production -ldflags "-s -w -X main.CurrentVersion=${VER}" -o writtt-amd64 .; then
            lipo -create -output writtt-bin writtt-arm64 writtt-amd64
          else
            cp writtt-arm64 writtt-bin
          fi
          chmod +x writtt-bin

          mkdir -p Writtt.app/Contents/MacOS Writtt.app/Contents/Resources
          cp writtt-bin Writtt.app/Contents/MacOS/Writtt
          if [ -f build/appicon.png ]; then
            cp build/appicon.png Writtt.app/Contents/Resources/appicon.png
          fi
          cat > Writtt.app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>Writtt</string>
            <key>CFBundleIdentifier</key>
            <string>com.writtt.studio</string>
            <key>CFBundleName</key>
            <string>Writtt</string>
            <key>CFBundleDisplayName</key>
            <string>Writtt</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${VER}</string>
            <key>CFBundleVersion</key>
            <string>${VER}</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

          ditto -c -k --sequesterRsrc --keepParent Writtt.app writtt-macos-universal.zip

          mkdir -p dmg-staging
          cp -R Writtt.app dmg-staging/Writtt.app
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Writtt" -srcfolder dmg-staging -ov -format UDZO writtt-macos-universal.dmg
          ls -lh writtt-macos-universal.dmg writtt-macos-universal.zip

      - name: Upload macOS Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asset-macos
          path: |
            writtt-macos-universal.dmg
            writtt-macos-universal.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install & Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Build Linux Portable Binary (Wails v3 PureGo GTK3)
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VER="${RAW_TAG#v}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags "production,purego,gtk3" -ldflags "-s -w -X main.CurrentVersion=${VER}" -o writtt .
          chmod +x writtt
          tar -czf writtt-linux-amd64.tar.gz writtt

      - name: Upload Linux Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-linux
          path: writtt-linux-amd64.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-assets
          merge-multiple: true

      - name: Create or Update GitHub Release (With Exponential Backoff)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ls -lh dist-assets/

          cat > release-notes.md <<'EOF'
          ## Writtt __TAG__

          Estudio editorial local-first sem distracoes e cofre criptografico Zero-Knowledge.
          Local-First Distraction-Free Editorial Studio & Zero-Knowledge Cryptographic Vault.

          ### Downloads

          | Platform | Artifact | Format |
          | :--- | :--- | :--- |
          | **Windows (x64)** | `writtt-windows-amd64-installer.exe` | Windows Installer (Recommended) |
          | **Windows (x64)** | `writtt-windows-amd64.exe` | Portable Standalone Executable |
          | **macOS (Universal)** | `writtt-macos-universal.dmg` | Universal Disk Image Installer (Apple Silicon + Intel) |
          | **macOS (Universal)** | `writtt-macos-universal.zip` | Universal `.app` Bundle Archive |
          | **Linux (x64)** | `writtt-linux-amd64.tar.gz` | Portable Native Binary (GTK3 / WebKit2GTK) |

          ### Notes
          - **Official Website & Documentation:** https://www.writtt.com
          - **Windows:** Run `writtt-windows-amd64-installer.exe` for Start Menu & Desktop installation (or use the portable `.exe`). If SmartScreen appears on first launch, choose _More info -> Run anyway_.
          - **macOS:** Open `writtt-macos-universal.dmg` and drag `Writtt.app` to `Applications`. On first launch of an unsigned build, allow via _System Settings -> Privacy & Security -> Open Anyway_.
          - **Linux:** Extract and run `chmod +x writtt && ./writtt`.
          EOF
          sed -i "s/__TAG__/${TAG}/g" release-notes.md

          PRERELEASE_FLAG=""
          if [[ "${TAG}" == *"-"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          DELAYS=(5 10 20 30 45 60 60 60)
          PUBLISHED=0

          for ATTEMPT in $(seq 1 8); do
            echo "Publishing release ${TAG} (attempt ${ATTEMPT}/8)..."

            DRAFT_IDS=$(gh api "/repos/${REPO}/releases" --jq ".[] | select(.tag_name == \"${TAG}\" and .draft == true) | .id" 2>/dev/null || true)
            for DID in ${DRAFT_IDS}; do
              echo "Removing stale draft release ID ${DID}..."
              gh api -X DELETE "/repos/${REPO}/releases/${DID}" || true
            done

            if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
              if gh release upload "${TAG}" dist-assets/* --clobber --repo "${REPO}" && \
                 gh release edit "${TAG}" --title "Writtt ${TAG}" --notes-file release-notes.md --draft=false --repo "${REPO}"; then
                PUBLISHED=1
                break
              fi
            else
              if gh release create "${TAG}" dist-assets/* \
                   --repo "${REPO}" \
                   --verify-tag \
                   --title "Writtt ${TAG}" \
                   --notes-file release-notes.md \
                   ${PRERELEASE_FLAG}; then
                PUBLISHED=1
                break
              fi
            fi

            if [ "${ATTEMPT}" -lt 8 ]; then
              WAIT_SEC=${DELAYS[$((ATTEMPT - 1))]}
              echo "GitHub Releases API returned an error; retrying in ${WAIT_SEC}s..."
              sleep "${WAIT_SEC}"
            fi
          done

          if [ "${PUBLISHED}" -ne 1 ]; then
            echo "Failed to publish GitHub Release ${TAG} after 8 attempts."
            exit 1
          fi
          echo "Successfully published Writtt ${TAG}!"
